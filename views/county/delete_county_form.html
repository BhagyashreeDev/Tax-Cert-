<%- include('../header.html') -%>
<%- include('../menu.html') -%>

<style type="text/css">
	
</style>

<main class="container">

	<div class="row gx-5">
		
		<div class="col-sm-12 col-md-12 p-1">
			<div class="bg-body-tertiary p-4">	
				<h6><span class="badge text-bg-danger rounded-0">Delete County</span></h6>
				<br>
				
				<!-- Search County Section -->
				<div class="mb-4">
					<h6 class="text-muted">Search County to Delete</h6>
					<div class="row">
						<div class="col-sm-4 col-md-4">
							<label for="search_state_code" class="form-label">State Code</label>
							<select class="form-select" name="search_state_code" id="search_state_code" aria-label="Default select example" autocomplete="off">
								<option selected value="">Select State Code</option>								
							</select>
						</div>
						<div class="col-sm-6 col-md-6">
							<label for="search_county_name" class="form-label">County Name</label>
							<input type="text" class="form-control" name="search_county_name" id="search_county_name" placeholder="Enter county name" autocomplete="off">
						</div>
						<div class="col-sm-2 col-md-2 d-flex align-items-end">
							<button type="button" id="searchBtn" class="btn btn-primary btn-sm rounded-0">Search</button>
						</div>
					</div>
					<div class="mt-2" id="search-result-display"></div>
				</div>

				<hr>

				<!-- Confirmation Section -->
				<div id="delete-confirmation" style="display: none;">
					<div class="card border-danger shadow">
						<div class="card-header bg-danger text-white">
							<h5 class="mb-0">Delete County Confirmation</h5>
						</div>
						<div class="card-body">
							<div class="alert alert-danger" role="alert">
								<strong>Warning:</strong> This action will permanently remove this county from the database and cannot be undone.
							</div>
							
							<h6 class="fw-bold mt-3">County Details:</h6>
							<div id="county-details" class="mt-2 p-3 bg-light border rounded"></div>
							
							<div class="mt-4 p-3 border rounded">
								<div class="form-check">
									<input class="form-check-input" type="checkbox" id="confirmCheckbox">
									<label class="form-check-label fw-bold" for="confirmCheckbox">
										I confirm that I want to permanently delete this county record
									</label>
								</div>
							</div>
						</div>
						<div class="card-footer bg-light">
							<div class="d-flex justify-content-end">
								<button type="button" id="cancelDeleteBtn" class="btn btn-secondary px-4 btn-sm rounded-0 me-2">Cancel</button>
								<button type="button" id="confirmDeleteBtn" class="btn btn-danger px-4 btn-sm rounded-0" disabled>Delete County</button>
							</div>
						</div>
					</div>
					<div class="mt-3" hidden id="delete-result-display"></div>
				</div>

			</div>
		</div>

	</div>

</main>

<script>

	(() => {
		const state_data = {"AL":"Alabama","AK":"Alaska","AZ":"Arizona","AR":"Arkansas","CA":"California","CO":"Colorado","CT":"Connecticut","DC": "District Of Columbia","DE":"Delaware","FL":"Florida","GA":"Georgia","HI":"Hawaii","ID":"Idaho","IL":"Illinois","IN":"Indiana","IA":"Iowa","KS":"Kansas","KY":"Kentucky","LA":"Louisiana","ME":"Maine","MD":"Maryland","MA":"Massachusetts","MI":"Michigan","MN":"Minnesota","MS":"Mississippi","MO":"Missouri","MT":"Montana","NE":"Nebraska","NV":"Nevada","NH":"New Hampshire","NJ":"New Jersey","NM":"New Mexico","NY":"New York","NC":"North Carolina","ND":"North Dakota","OH":"Ohio","OK":"Oklahoma","OR":"Oregon","PA":"Pennsylvania","RI":"Rhode Island","SC":"South Carolina","SD":"South Dakota","TN":"Tennessee","TX":"Texas","UT":"Utah","VT":"Vermont","VA":"Virginia","WA":"Washington","WV":"West Virginia","WI":"Wisconsin","WY":"Wyoming"};	

		// LOAD THE STATE CODE
		const search_state_code_select = document.getElementById("search_state_code");
		
		function load_state_code(){
			for(const property in state_data) {
				const searchOption = document.createElement("option");
				searchOption.value = property;
				searchOption.textContent = property;
				search_state_code_select.append(searchOption);
			}
		}
		load_state_code();
	})();

	(() => {
		// SEARCH COUNTY
		const searchBtn = document.getElementById("searchBtn");
		const searchResultDiv = document.getElementById("search-result-display");
		const deleteConfirmation = document.getElementById("delete-confirmation");
		const deleteResultDiv = document.getElementById("delete-result-display");
		let selectedCountyId = null;

		searchBtn.addEventListener("click", async () => {
			const state_code = document.getElementById("search_state_code").value;
			const county_name = document.getElementById("search_county_name").value.trim();

			searchResultDiv.innerHTML = "";
			deleteConfirmation.style.display = "none";

			if(!state_code && !county_name) {
				searchResultDiv.innerHTML = '<div class="alert alert-warning">Please select a state code or enter a county name</div>';
				return;
			}

			try {
				const response = await fetch(`/county/search?state_code=${state_code}&county_name=${county_name}`);
				const result = await response.json();

				if(result.error) {
					searchResultDiv.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
					return;
				}

				if(result.data.length === 0) {
					searchResultDiv.innerHTML = '<div class="alert alert-info">No counties found</div>';
					return;
				}

				// Display search results
				let html = '<div class="table-responsive"><table class="table table-bordered table-sm"><thead><tr><th>State</th><th>County</th><th>Website</th><th>Path</th><th>Status</th><th>Action</th></tr></thead><tbody>';
				result.data.forEach(county => {
					const statusText = county.status == 1 ? '<span class="badge bg-success">Live</span>' : '<span class="badge bg-secondary">Disabled</span>';
					html += `<tr>
						<td>${county.state_code}</td>
						<td>${county.county_name}</td>
						<td><a href="${county.property_tax_link}" target="_blank" class="text-truncate d-inline-block" style="max-width: 200px;">${county.property_tax_link}</a></td>
						<td>${county.path}</td>
						<td>${statusText}</td>
						<td><button class="btn btn-sm btn-danger rounded-0" onclick="showDeleteConfirmation(${county.id}, '${county.state_code}', '${county.county_name}')">Delete</button></td>
					</tr>`;
				});
				html += '</tbody></table></div>';
				searchResultDiv.innerHTML = html;

			} catch(error) {
				console.log(error);
				searchResultDiv.innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
			}
		});

		// Show delete confirmation
		window.showDeleteConfirmation = async (id, state_code, county_name) => {
			selectedCountyId = id;
			deleteResultDiv.setAttribute("hidden", true);
			
			// Reset checkbox
			const checkbox = document.getElementById("confirmCheckbox");
			checkbox.checked = false;
			document.getElementById("confirmDeleteBtn").disabled = true;

			try {
				const response = await fetch(`/county/get/${id}`);
				const result = await response.json();

				if(result.error) {
					alert(result.message);
					return;
				}

				const county = result.data;
				const statusText = county.status == 1 ? '<span class="badge bg-success">Live</span>' : '<span class="badge bg-secondary">Disabled</span>';
				
				document.getElementById("county-details").innerHTML = `
					<table class="table table-sm table-bordered mb-0">
						<tr><th class="bg-light" width="30%">State Code:</th><td>${county.state_code}</td></tr>
						<tr><th class="bg-light">State Name:</th><td>${county.state_name}</td></tr>
						<tr><th class="bg-light">County Name:</th><td>${county.county_name}</td></tr>
						<tr><th class="bg-light">Website Link:</th><td><a href="${county.property_tax_link}" target="_blank">${county.property_tax_link}</a></td></tr>
						<tr><th class="bg-light">Path:</th><td><code>${county.path}</code></td></tr>
						<tr><th class="bg-light">Status:</th><td>${statusText}</td></tr>
					</table>
				`;

				deleteConfirmation.style.display = "block";
				deleteConfirmation.scrollIntoView({ behavior: 'smooth' });

			} catch(error) {
				console.log(error);
				alert("Error loading county data");
			}
		};

		// Enable/disable delete button based on checkbox
		document.getElementById("confirmCheckbox").addEventListener("change", (e) => {
			document.getElementById("confirmDeleteBtn").disabled = !e.target.checked;
		});

		// Cancel delete
		document.getElementById("cancelDeleteBtn").addEventListener("click", () => {
			deleteConfirmation.style.display = "none";
			selectedCountyId = null;
			document.getElementById("confirmCheckbox").checked = false;
			document.getElementById("confirmDeleteBtn").disabled = true;
		});

		// Confirm delete
		document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
			if(!selectedCountyId) {
				return;
			}

			// Final confirmation
			const finalConfirm = confirm("Are you sure you want to permanently delete this county? This action cannot be undone.");
			if(!finalConfirm) {
				return;
			}

			deleteResultDiv.setAttribute("hidden", true);

			// Disable button during delete operation
			const deleteBtn = document.getElementById("confirmDeleteBtn");
			const originalText = deleteBtn.innerHTML;
			deleteBtn.disabled = true;
			deleteBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Processing...';

			try {
				const response = await fetch(`/county/delete/${selectedCountyId}`, {
					method: "DELETE"
				});
				const result = await response.json();

				if(result.error) {
					deleteResultDiv.removeAttribute("hidden");
					deleteResultDiv.innerHTML = `<div class="alert alert-danger">${result.message}</div>`;
					deleteBtn.disabled = false;
					deleteBtn.innerHTML = originalText;
					return;
				}

				deleteResultDiv.removeAttribute("hidden");
				deleteResultDiv.innerHTML = `<div class="alert alert-success">${result.message}</div>`;

				// Refresh search results
				setTimeout(() => {
					deleteConfirmation.style.display = "none";
					selectedCountyId = null;
					document.getElementById("confirmCheckbox").checked = false;
					deleteBtn.disabled = true;
					deleteBtn.innerHTML = originalText;
					document.getElementById("searchBtn").click();
				}, 2000);

			} catch(error) {
				console.log(error);
				deleteResultDiv.removeAttribute("hidden");
				deleteResultDiv.innerHTML = `<div class="alert alert-danger">${error.message}</div>`;
				deleteBtn.disabled = false;
				deleteBtn.innerHTML = originalText;
			}
		});

	})();

</script>

<%- include('../footer.html') -%>
